<style>

.file-list{font-size:11px;color:var(--m);margin-top:5px}.edit-icon{display:none}.editing .edit-icon{display:inline-flex}

<script>
const VERSION='3.1', TODAY='11/09/2026', EDIT_DATE='11/09/2026', KEY='MeuAppFinanceiro_DB';
const NAV=[
 ['home','fa-house','Inicial'],['mensais','fa-file-invoice-dollar','Despesas Mensais'],['compras','fa-bag-shopping','Minhas Compras'],
 ['futuras','fa-calendar-days','Contas Futuras'],['gastos','fa-chart-line','Tabela de Gastos'],
 ['historico','fa-magnifying-glass','Busca Histórico'],['devedores','fa-hand-holding-dollar','Pessoas Devem'],['cadastros','fa-users','Cadastros'],['config','fa-gear','Configurações'],
 ['como','fa-circle-question','Como usar o APP'],['sobre','fa-circle-info','Sobre']
];
const DEFAULT={
 version:VERSION,
 settings:{theme:'modern-light',jsonName:'MeuAPPFinanceiro_dados.json',navOrder:null},
 users:[], payments:[], accounts:[], categories:[],
 monthly:[], purchases:[], returns:[], consumption:[],
 debts:[], futureDebts:[], history:[]
};
let db=loadDB(), currentReg='users', editingPurchases=false, editingMensais=false, chartMode='line', purchasesChartMode='line', gastosTab='faturas', selectedFiles=[];
let jsonHandle=null, dirHandle=null, fileWriteQueue=Promise.resolve();

function esc(v){return String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function money(v){return (Number(v)||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'})}
function num(v){
 const raw=String(v??'').trim();
 if(!raw)return 0;
 let x=raw.replace(/R\$\s?/gi,'').replace(/\s/g,'');
 if(x.includes(',')){x=x.replace(/\./g,'').replace(',','.')}
 else if((x.match(/\./g)||[]).length>1){x=x.replace(/\./g,'')}
 const n=Number(x); return Number.isFinite(n)?n:0;
}
function moneyInputValue(v){return num(v).toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2})}
function moneyTypingValue(v){const digits=String(v??'').replace(/\D/g,'');if(!digits)return '';const cents=(digits.slice(-2)||'00').padStart(2,'0');let integer=digits.slice(0,-2)||'0';integer=integer.replace(/^0+(?=\d)/,'');integer=integer.padStart(4,'0');integer=integer.replace(/\B(?=(\d{3})+(?!\d))/g,'.');return integer+','+cents}
function handleMoneyInput(el){if(!el)return;el.value=moneyTypingValue(el.value);try{el.setSelectionRange(el.value.length,el.value.length)}catch(e){}}
function moneyInput(id,v,placeholder='R$ 0,00'){const has=String(v??'').trim()!=='';return `<input id=\"${id}\" class=\"money-input\" inputmode=\"numeric\" autocomplete=\"off\" value=\"${has?esc(moneyInputValue(v)):''}\" placeholder=\"${placeholder}\" onfocus=\"this.select()\" oninput=\"handleMoneyInput(this)\" onblur=\"if(this.value.trim()!=='')this.value=moneyInputValue(this.value)\">`}
function uid(p='id'){return p+Date.now().toString(36)+Math.random().toString(36).slice(2,7)}
function iso(d=new Date()){return new Date(d).toISOString().slice(0,10)}
function fmtDate(s){if(!s)return '—';const [y,m,d]=String(s).slice(0,10).split('-');return d&&m&&y?`${d}/${m}/${y}`:s}
function daysBetween(a,b){return Math.ceil((new Date(b+'T23:59:59')-new Date(a+'T00:00:00'))/86400000)}
function today(){return iso()}
function norm(s){return String(s||'').normalize('NFD').replace(/[\\u0300-\\u036f]/g,'').toLowerCase()}
function emojiFor(name){
 const n=norm(name);
 const rules=[
  [/luz|energia|eletrica/,'💡'],[/agua|saneamento/,'💧'],[/gas/,'🔥'],[/internet|wifi/,'🌐'],[/telefone|celular/,'📱'],
  [/aluguel|condominio|iptu/,'🏠'],[/financiamento/,'🏦'],[/emprestimo/,'💸'],[/escola|faculdade|curso/,'🎓'],
  [/farmacia|remedio|medic/,'💊'],[/mercado|supermercado/,'🛒'],[/restaurante|lanche|comida/,'🍽️'],[/combustivel|gasolina|etanol/,'⛽'],
  [/uber|taxi|transporte|onibus/,'🚗'],[/cinema|lazer|jogo/,'🎮'],[/roupa|vestuario/,'👕'],[/moveis|eletro/,'🛋️'],
  [/geladeira/,'🧊'],[/televisao|tv/,'📺'],[/computador|notebook/,'💻'],[/cartao|credito|debito/,'💳'],[/pix/,'💠'],
  [/boleto/,'🧾'],[/salario|pagamento recebido|renda/,'💰'],[/presente/,'🎁'],[/conta|fatura|cobranca/,'📄'],[/categoria|outro/,'📁']
 ];
 for(const [re,e] of rules)if(re.test(n))return e;
 return '💰';
}
function loadDB(){
 try{
  const x=JSON.parse(localStorage.getItem(KEY)||'null');
  if(x&&typeof x==='object')return {...structuredClone(DEFAULT),...x};
 }catch(e){}
 return structuredClone(DEFAULT);
}
function showNotice(message,options={}){
 let box=document.getElementById('appNotice');
 if(!box){box=document.createElement('div');box.id='appNotice';document.body.appendChild(box)}
 const action=options.action?`<button class="notice-action" onclick="${options.action}">${esc(options.actionLabel||'Configurações')}</button>`:'';
 box.innerHTML=`<span>${esc(message)}</span>${action}<button class="notice-close" onclick="this.parentElement.classList.remove('show')">×</button>`;
 box.classList.add('show');clearTimeout(window.__noticeTimer);if(options.duration!==0)window.__noticeTimer=setTimeout(()=>box.classList.remove('show'),options.duration||4500);
}
function actionError(e,prefix='Erro'){console.error(e);const msg=e?.message||String(e||'Erro desconhecido');showNotice(prefix+': '+msg,{duration:7000});return false}
window.alert=function(message){showNotice(String(message),{duration:5500})};
function persistNow(){try{localStorage.setItem(KEY,JSON.stringify(db));scheduleFileSave();renderAll();return true}catch(e){return actionError(e,'Erro ao salvar os dados')}}
function confirmAction(title,message,onConfirm){window.__confirmAction=typeof onConfirm==='function'?onConfirm:null;openModal(`<div class="row between"><h2>${esc(title)}</h2><button class="btn g sm" onclick="cancelConfirmAction()">Cancelar</button></div><p style="margin:14px 0">${esc(message)}</p><div class="modal-actions"><button class="btn g" onclick="cancelConfirmAction()">Não</button><button class="btn p" onclick="runConfirmAction()">Sim, confirmar</button></div>`)}
function runConfirmAction(){const fn=window.__confirmAction;window.__confirmAction=null;if(fn)fn()}
function cancelConfirmAction(){window.__confirmAction=null;closeModal()}
function save(){persistNow()}
function saveEdited(mutate){try{mutate();localStorage.setItem(KEY,JSON.stringify(db));scheduleFileSave();closeModal();renderAll();return true}catch(e){return actionError(e,'Erro ao salvar')}}
function addHistory(type,item,extra={}){
 db.history.unshift({id:uid('h'),date:today(),type,itemId:item?.id||'',name:item?.name||'',...extra});
}
function closeModal(){
 const paymentId=window.paymentModalId,committed=!!window.paymentModalCommitted;
 if(paymentId&&!committed){const cb=document.querySelector(`input.check[onchange*="toggleMonthly('${paymentId}'"]`);if(cb)cb.checked=false;}
 if(!committed)document.querySelectorAll('input.check:checked').forEach(cb=>{cb.checked=false;});
 window.paymentModalId='';window.paymentModalCommitted=false;window.paymentModalMode='';window.paymentSelectedPeople=[];window.paymentSelectedDebtors=[];window.paymentPercentages={};
 document.getElementById('modalBg').classList.remove('show');
}
function openModal(html){document.getElementById('modal').innerHTML=html;document.getElementById('modalBg').classList.add('show')}
document.getElementById('modalBg').onclick=e=>{if(e.target.id==='modalBg')closeModal()}
function toggleMenu(){
 const s=document.getElementById('sidebar'),o=document.getElementById('menuOverlay');
 s.classList.toggle('open');o?.classList.toggle('show',s.classList.contains('open'));
}
function closeMenu(){
 document.getElementById('sidebar')?.classList.remove('open');
 document.getElementById('menuOverlay')?.classList.remove('show');
}
document.addEventListener('click',e=>{
 const s=document.getElementById('sidebar'),m=document.querySelector('.mobile');
 if(s?.classList.contains('open') && !s.contains(e.target) && !m?.contains(e.target)) closeMenu();
});
function go(id){
 document.querySelectorAll('.view').forEach(x=>x.classList.remove('active'));
 document.getElementById(id)?.classList.add('active');
 document.querySelectorAll('.nav li').forEach(x=>x.classList.toggle('active',x.dataset.id===id));
 closeMenu(); renderAll();
}
function getNav(){const saved=Array.isArray(db.settings?.navOrder)?db.settings.navOrder:[];const byId=new Map(NAV.map(x=>[x[0],x]));const ordered=saved.map(id=>byId.get(id)).filter(Boolean);NAV.forEach(x=>{if(!saved.includes(x[0]))ordered.push(x)});return ordered}
function buildNav(){document.getElementById('nav').innerHTML=getNav().map(([id,ic,n])=>`<li data-id="${id}" onclick="go('${id}')"><i class="fa-solid ${ic}"></i><span>${n}</span></li>`).join('')}
let pendingNavOrder=null;
function openNavOrder(){pendingNavOrder=getNav().map(x=>x[0]);renderNavOrderModal()}
function renderNavOrderModal(){const arr=pendingNavOrder||getNav().map(x=>x[0]);const byId=new Map(NAV.map(x=>[x[0],x]));const items=arr.map(id=>byId.get(id)).filter(Boolean);openModal(`<div class="row between"><h2>Ordem do menu</h2><button class="btn g sm" onclick="pendingNavOrder=null;closeModal()">Fechar</button></div><p class="muted" style="margin:8px 0 12px">Use as setas para escolher a ordem das telas. A mesma ordem será usada em “Como usar o APP”.</p><div>${items.map(([id,ic,n],i)=>`<div class="item" style="display:flex;align-items:center;justify-content:space-between;gap:8px;margin:6px 0;padding:9px 10px"><span><i class="fa-solid ${ic}" style="width:22px"></i>${n}</span><span style="display:flex;gap:5px"><button class="btn sm g" onclick="moveNavItem(${i},-1)" ${i===0?'disabled':''}>↑</button><button class="btn sm g" onclick="moveNavItem(${i},1)" ${i===items.length-1?'disabled':''}>↓</button></span></div>`).join('')}</div><div class="modal-actions"><button class="btn g" onclick="pendingNavOrder=NAV.map(x=>x[0]);renderNavOrderModal()">Restaurar padrão</button><button class="btn p" onclick="saveNavOrder()">Salvar ordem</button></div>`)}
function moveNavItem(index,delta){const ni=index+delta;if(ni<0||ni>=pendingNavOrder.length)return;[pendingNavOrder[index],pendingNavOrder[ni]]=[pendingNavOrder[ni],pendingNavOrder[index]];renderNavOrderModal()}
function saveNavOrder(){db.settings.navOrder=[...(pendingNavOrder||getNav().map(x=>x[0]))];pendingNavOrder=null;localStorage.setItem(KEY,JSON.stringify(db));closeModal();buildNav();renderComo();showNotice('Ordem do menu salva.',{duration:3000})}
function filteredDate(r,from,to){const d=String(r.paidDate||r.receivedDate||r.arrivalDate||r.date||r.dueDate||'');return (!from||d>=from)&&(!to||d<=to)}
function periodHTML(prefix='f'){
 const years=Array.from({length:11},(_,i)=>new Date().getFullYear()-5+i);
 return `<div class="filters">
 <label>Período<select id="${prefix}Period" onchange="periodChange('${prefix}')"><option value="open_current" ${prefix==='m'?'selected':''}>Em aberto + Mês vigente</option><option value="all" ${prefix!=='m'?'selected':''}>Todos</option><option value="day">Dia</option><option value="week">Semana</option><option value="month">Mês</option><option value="year">Ano</option><option value="custom">Período específico</option></select></label>
 <label id="${prefix}DayWrap" style="display:none">Dia<input id="${prefix}Day" type="date"></label>
 <label id="${prefix}WeekWrap" style="display:none">Semana<input id="${prefix}Week" type="week"></label>
 <label id="${prefix}MonthWrap" style="display:none">Mês<input id="${prefix}Month" type="month"></label>
 <label id="${prefix}YearWrap" style="display:none">Ano<select id="${prefix}Year">${years.map(y=>`<option>${y}</option>`).join('')}</select></label>
 <label id="${prefix}FromWrap" style="display:none">Início<input id="${prefix}From" type="date"></label>
 <label id="${prefix}ToWrap" style="display:none">Fim<input id="${prefix}To" type="date"></label>
 </div>`;
}
function filterVal(prefix,id,def=''){return document.getElementById(id)?.value ?? window.filterValues?.[prefix]?.[id] ?? def}
function captureFilter(prefix,ids){window.filterValues=window.filterValues||{};window.filterValues[prefix]=window.filterValues[prefix]||{};ids.forEach(id=>{const el=document.getElementById(id);if(el)window.filterValues[prefix][id]=el.value})}
function restoreFilter(prefix,ids){(ids||[]).forEach(id=>{const el=document.getElementById(id),v=window.filterValues?.[prefix]?.[id];if(el&&v!==undefined)el.value=v});const p=filterVal(prefix,prefix+'Period','all');if(document.getElementById(prefix+'Period')){document.getElementById(prefix+'Period').value=p;periodChange(prefix)}}
function historyPeriodHTML(){return periodHTML('h')+`<div class="filters" style="margin-top:8px"><label>Tipo<select id="hType"><option value="">Todos</option><option value="pay">Saídas (pagos)</option><option value="receive">Entradas (recebidos)</option></select></label><label>Pessoa<select id="hUser">${selectOpts(db.users,'Todos')}</select></label><label>Meio de pagamento<select id="hPay">${selectOpts(db.payments,'Todos')}</select></label><label>Categoria<select id="hCat"><option value="">Todos</option>${db.categories.map(c=>`<option value="${esc(c.name)}">${esc(c.name)}</option>`).join('')}</select></label><label>Conta<select id="hAcc">${selectOpts(db.accounts,'Todos')}</select></label><label>Ordem das faturas<select id="hOrder"><option value="paidAsc">Data de pag. Crescente</option><option value="paidDesc">Data de pag. Decrescente</option><option value="dueAsc">Data de Venc. Crescente</option><option value="dueDesc">Data de Venc. Decrescente</option></select></label><label>Ordem do período<select id="hPeriodOrder"><option value="old">Mês antigos primeiro</option><option value="new">Meses recentes primeiro</option></select></label></div><label class="home-filter-check"><input id="hSeparate" type="checkbox"> Mostrar Recebidos e Pagos separados</label><div class="filter-confirm"><button class="btn g sm" onclick="restoreHistoryFilters()">Mostrar Padrão</button></div>`}

function periodRange(prefix){
 const p=filterVal(prefix,prefix+'Period','all'), now=new Date(), y=now.getFullYear(),m=String(now.getMonth()+1).padStart(2,'0');
 if(p==='open_current'){const first=`${y}-${m}-01`;const last=new Date(y,Number(m),0).getDate();return [first,`${y}-${m}-${last}`]}
 if(p==='all')return ['0000-01-01','9999-12-31'];
 if(p==='day'){const d=filterVal(prefix,prefix+'Day',today());return [d,d]}
 if(p==='week'){const w=filterVal(prefix,prefix+'Week','');if(w){const [yy,ww]=w.split('-W').map(Number);const jan4=new Date(yy,0,4);const day=jan4.getDay()||7;const monday=new Date(jan4);monday.setDate(jan4.getDate()-day+1+(ww-1)*7);const sunday=new Date(monday);sunday.setDate(monday.getDate()+6);return [iso(monday),iso(sunday)]}const d=new Date();const day=d.getDay()||7;d.setDate(d.getDate()-day+1);const sunday=new Date(d);sunday.setDate(d.getDate()+6);return [iso(d),iso(sunday)]}
 if(p==='month'){const mv=filterVal(prefix,prefix+'Month',`${y}-${m}`)||`${y}-${m}`;const [yy,mm]=mv.split('-');return [`${yy}-${mm}-01`,`${yy}-${mm}-${new Date(Number(yy),Number(mm),0).getDate()}`]}
 if(p==='year'){const yy=filterVal(prefix,prefix+'Year',y);return [`${yy}-01-01`,`${yy}-12-31`]}
 return [filterVal(prefix,prefix+'From','0000-01-01')||'0000-01-01',filterVal(prefix,prefix+'To','9999-12-31')||'9999-12-31'];
}
function periodChange(prefix){const p=document.getElementById(prefix+'Period')?.value||'all';['Day','Week','Month','Year','From','To'].forEach(k=>{const w=document.getElementById(prefix+k+'Wrap');if(w)w.style.display='none'});if(p==='day')document.getElementById(prefix+'DayWrap').style.display='block';if(p==='week')document.getElementById(prefix+'WeekWrap').style.display='block';if(p==='month')document.getElementById(prefix+'MonthWrap').style.display='block';if(p==='year')document.getElementById(prefix+'YearWrap').style.display='block';if(p==='custom'){document.getElementById(prefix+'FromWrap').style.display='block';document.getElementById(prefix+'ToWrap').style.display='block'}}
function toggleFilters(id){const el=document.getElementById(id);if(!el)return;el.classList.toggle('open');const b=document.querySelector(`[data-filter-target="${id}"]`);if(b){b.querySelector('.filter-arrow').textContent=el.classList.contains('open')?'▲':'▼'}}
function filterButton(id,label='Filtrar'){return `<div class="filter-confirm"><button class="btn p sm" onclick="applyFilters('${id}')">${label}</button></div>`}
function applyFilters(id){const el=document.getElementById(id);if(!el)return;const map={filtersMensais:['m',['mPeriod','mDay','mWeek','mMonth','mYear','mFrom','mTo','mfUser','mfPay','mfCat','mfAcc']],filtersConsumo:['c',['cPeriod','cDay','cWeek','cMonth','cYear','cFrom','cTo','cfSearch','cfUser','cfPay','cfCat']],filtersGastos:['g',['gPeriod','gDay','gWeek','gMonth','gYear','gFrom','gTo','gfUser','gfPay','gfCat','gfAcc']],filtersHistorico:['h',['hPeriod','hDay','hWeek','hMonth','hYear','hFrom','hTo','hType','hUser','hPay','hCat','hAcc']]};const cfg=map[id];if(cfg)captureFilter(cfg[0],cfg[1]);if(id==='filtersGastos')applyExpenseFilterState();if(id==='filtersHistorico'){window.filterValues=window.filterValues||{};window.filterValues.h=window.filterValues.h||historyFilterDefaults();window.filterValues.h.hOrder=document.getElementById('hOrder')?.value||'paidAsc';window.filterValues.h.hPeriodOrder=document.getElementById('hPeriodOrder')?.value||'old';window.filterValues.h.hSeparate=!!document.getElementById('hSeparate')?.checked}el.classList.remove('open');const b=document.querySelector(`[data-filter-target="${id}"]`);if(b)b.querySelector('.filter-arrow').textContent='▼';renderAll()}
function filterBox(id,content){return `<div class="filter-box"><button class="filter-toggle" data-filter-target="${id}" onclick="toggleFilters('${id}')">⚙️ Filtros <span class="filter-arrow">▼</span></button><div class="filter-panel" id="${id}">${content}${filterButton(id)}</div></div>`}
function selectOpts(arr,all='Todos'){return `<option value="">${all}</option>`+arr.map(x=>`<option value="${esc(x.id)}">${esc(x.name)}</option>`).join('')}

function homeFilterDefaults(){
 const now=new Date(), y=now.getFullYear(), m=String(now.getMonth()+1).padStart(2,'0');

function homePeriodRange(f){const year=Number(f.year)||new Date().getFullYear();if(!f.month)return [`${year}-01-01`,`${year}-12-31`];const month=Number(f.month);if(f.range==='month'){const last=new Date(year,month,0).getDate();return [`${year}-${String(month).padStart(2,'0')}-01`,`${year}-${String(month).padStart(2,'0')}-${last}`]};const n=Number(f.range)||1;const end=new Date(year,month-1,1);const start=new Date(year,month-1-(n-1),1);const endLast=new Date(end.getFullYear(),end.getMonth()+1,0).getDate();return [iso(start),iso(new Date(end.getFullYear(),end.getMonth(),endLast))]}

function getMonthlyFiltered(){
 const [from,to]=periodRange('m'),u=filterVal('m','mfUser',''),p=filterVal('m','mfPay',''),c=filterVal('m','mfCat',''),a=filterVal('m','mfAcc',''),period=filterVal('m','mPeriod','open_current');
 const now=new Date(),curMonth=iso(new Date(now.getFullYear(),now.getMonth(),1)).slice(0,7),prevDate=new Date(now.getFullYear(),now.getMonth()-1,1),prevMonth=iso(prevDate).slice(0,7);
 return db.monthly.filter(x=>{
   if(isPurchaseLinkedMonthly(x))return false;
   const month=String(x.dueDate||'').slice(0,7); const openCurrent=period==='open_current';
   const periodOk=openCurrent ? (month===curMonth || (month===prevMonth&&!x.paidDate)) : filteredDate(x,from,to);
   const personOk=!u || (u.endsWith(':paid') ? (x.paidBy?.some(v=>v.userId===u.split(':')[0])||x.payerId===u.split(':')[0]) && !!x.paidDate
     : u.endsWith(':all') ? (x.payerId===u.split(':')[0] || x.receiverId===u.split(':')[0] || x.paidBy?.some(v=>v.userId===u.split(':')[0]))

   return periodOk&&personOk&&(!p||x.paymentId===p)&&(!c||x.category===c)&&(!a||x.accountId===a);
 }).sort((a,b)=>String(a.dueDate||'').localeCompare(String(b.dueDate||'')));

function convertMonthlyToAccount(x){if(!x||x.recurrence==='once')return;let acc=db.accounts.find(a=>a.id===x.accountId)||db.accounts.find(a=>a.name===x.name&&a.repeat===x.recurrence);if(!acc){acc={id:uid('acc'),name:x.name,direction:x.type==='receive'?'in':'out',value:num(x.amount),dueDate:x.dueDate,paymentMethods:x.paymentId?[x.paymentId]:[],payerId:x.type==='receive'?(x.receiverId||x.payerId||''):(x.payerId||''),referenceMonth:x.referenceMonth||String(x.dueDate).slice(0,7),repeat:x.recurrence,period:'indefinite',fixedCount:0,startMonth:String(x.dueDate).slice(0,7),endMonth:''};db.accounts.push(acc)}x.accountId=acc.id;x.sourceAccountId=acc.id;x.sourceOccurrence=1;syncAccountMonthly(acc)}

function saveMonthly(id){
 const old=id?db.monthly.find(v=>v.id===id):null;
 const base={id:id||uid('m'),name:document.getElementById('mn')?.value.trim()||'',type:document.getElementById('mt')?.value||'pay',amount:num(document.getElementById('ma')?.value),payerId:document.getElementById('mp')?.value||'',receiverId:document.getElementById('mt')?.value==='receive'?(document.getElementById('mp')?.value||''):'',paymentId:document.getElementById('mpp')?.value||'',category:document.getElementById('mc')?.value||'',accountId:document.getElementById('macc')?.value||'',dueDate:document.getElementById('md')?.value||'',installments:Number(document.getElementById('mpar')?.value)||1,recurrence:document.getElementById('mrec')?.value||'once',referenceMonth:document.getElementById('mref')?.value||'',notes:document.getElementById('mnotes')?.value.trim()||'',paidDate:document.getElementById('mpaid')?.value||old?.paidDate||'',paidBy:old?.paidBy||[]};
 if(!base.name)return alert('Informe o nome.');
 if(!base.dueDate)return alert('Informe a data de vencimento/recebimento.');
 if(old)return saveEdited(()=>{const wasRecurring=old.recurrence&&old.recurrence!=='once';const becomesRecurring=base.recurrence&&base.recurrence!=='once';const originalName=old.name;if(window.futureEditMode?.allFuture)saveFutureSeries(id,base,originalName);Object.assign(old,base);if(!wasRecurring&&becomesRecurring)convertMonthlyToAccount(old);addHistory('mensal',old,{action:'edit'});window.futureEditMode=null});
 const count=Math.max(1,base.installments),first=base.dueDate,seriesId=uid('serie'),rows=[];
 const installmentAmount=Number((base.amount/count).toFixed(2));
 for(let i=0;i<count;i++){const d=addMonthsSafe(first,i);rows.push({...base,id:uid('m'),seriesId,installment:i+1,installments:count,totalAmount:base.amount,amount:i===count-1?Number((base.amount-installmentAmount*(count-1)).toFixed(2)):installmentAmount,dueDate:iso(d),referenceMonth:iso(d).slice(0,7),paidDate:i===0?base.paidDate:''})}
 const step=repeatStep(base.recurrence);if(step){for(let i=1;i<=24;i++){const d=addMonthsSafe(first,i*step);rows.push({...base,id:uid('m'),seriesId,installment:1,installments:1,dueDate:iso(d),referenceMonth:iso(d).slice(0,7),paidDate:''})}}
 db.monthly.unshift(...rows);addHistory('mensal',rows[0],{action:'create',createdCount:rows.length});persistNow();closeModal();
}
function repeatStep(kind){return {once:0,monthly:1,quarterly:3,semiannual:6,annual:12}[kind]||0}

function recalcEqualPeople(){const ids=window.paymentSelectedPeople||[];const vals=equalSplit(ids.length);window.paymentPercentages=window.paymentPercentages||{};ids.forEach((id,i)=>window.paymentPercentages[id]=vals[i]);}
function recalcDebtPeople(){const ids=window.paymentSelectedDebtors||[];const vals=debtSplit(ids.length);window.debtPercentages=window.debtPercentages||{};ids.forEach((id,i)=>window.debtPercentages[id]=vals[i]);}
function capturePaymentPercents(){window.paymentPercentages=window.paymentPercentages||{};window.debtPercentages=window.debtPercentages||{};document.querySelectorAll('.pay-percent').forEach(el=>{if(el.dataset.user)window.paymentPercentages[el.dataset.user]=num(el.value)});document.querySelectorAll('.debt-percent').forEach(el=>{if(el.dataset.user)window.debtPercentages[el.dataset.user]=num(el.value)});}
function renderSelectedPaymentPeople(){
 const box=document.getElementById('selectedPaymentPeople');if(!box)return;const ids=window.paymentSelectedPeople||[];const vals=equalSplit(ids.length);window.paymentPercentages=window.paymentPercentages||{};
 box.innerHTML=ids.map((id,i)=>{const u=db.users.find(v=>v.id===id);const val=window.paymentPercentages[id]??vals[i];return `<div class="selected-person-row"><span class="selected-person-name">${emojiForUser(u)} ${esc(u?.name||'Pessoa')}</span><div class="selected-person-percent"><input class="pay-percent" data-user="${id}" type="number" min="0" max="100" step="1" value="${val}"><span>%</span></div><button type="button" class="remove-person" onclick="removePaymentPerson('${id}')" title="Remover">×</button></div>`}).join('');
 const picker=document.getElementById('paymentPersonPicker');if(picker)picker.innerHTML=paymentPeoplePicker(ids,'paid');

function equalSplit(n){if(!n)return [];const base=Math.floor((100/n)*100)/100;const out=Array.from({length:n},()=>base);out[n-1]=Number((100-base*(n-1)).toFixed(2));return out;}
function debtSplit(n){if(!n)return [];const base=Math.floor((100/(n+1))*100)/100;return Array.from({length:n},()=>base);}
function addPaymentPersonFromPicker(){capturePaymentPercents();const id=document.getElementById('paymentPersonSelect')?.value;if(!id)return;window.paymentSelectedPeople=window.paymentSelectedPeople||[];if(!window.paymentSelectedPeople.includes(id)){window.paymentSelectedPeople.push(id);recalcEqualPeople();}renderSelectedPaymentPeople();}

function renderDebtPeople(){

 box.innerHTML=ids.map((id,i)=>{const u=db.users.find(v=>v.id===id);const val=window.debtPercentages[id]??vals[i];return `<div class="selected-person-row"><span class="selected-person-name">${emojiForUser(u)} ${esc(u?.name||'Pessoa')}</span><div class="selected-person-percent"><input class="debt-percent" data-user="${id}" type="number" min="0" max="100" step="1" value="${val}"><span>%</span></div><button type="button" class="remove-person" onclick="removeDebtPerson('${id}')" title="Remover">×</button></div>`}).join('');

function openPaymentPeopleModal(id){

function confirmMonthlyPayment(id){
 const x=db.monthly.find(v=>v.id===id);if(!x)return;capturePaymentPercents();const paidIds=window.paymentSelectedPeople||[];if(!paidIds.length)return alert('Selecione quem pagou/recebeu.');let paidVals=paidIds.map(id=>num(document.querySelector(`.pay-percent[data-user="${id}"]`)?.value));if(paidVals.every(v=>!v))paidVals=equalSplit(paidIds.length);const paidSum=paidVals.reduce((a,b)=>a+b,0);if(Math.abs(paidSum-100)>0.01)return alert('A soma dos percentuais de Quem pagou/recebeu deve ser 100%.');
 const debtIds=window.paymentSelectedDebtors||[];let debtVals=debtIds.map(id=>num(document.querySelector(`.debt-percent[data-user="${id}"]`)?.value));if(debtIds.length&&debtVals.every(v=>!v))debtVals=debtSplit(debtIds.length);const debtSum=debtVals.reduce((a,b)=>a+b,0);if(debtSum>100.01)return alert('A soma das porcentagens de quem fica devendo não pode ultrapassar 100%.');
 const paidDate=document.getElementById('paidDate')?.value||today(),paymentId=document.getElementById('actualPayMethod')?.value||'',total=num(x.amount);if(total<=0)return alert('Informe um valor antes de marcar como pago/recebido.');
 const amounts=paidVals.map(v=>Number((total*v/100).toFixed(2)));const delta=Number((total-amounts.reduce((a,b)=>a+b,0)).toFixed(2));if(amounts.length)amounts[amounts.length-1]=Number((amounts[amounts.length-1]+delta).toFixed(2));
 const debtAmounts=debtVals.map(v=>Number((total*v/100).toFixed(2)));
 x.paidDate=paidDate;x.paymentId=paymentId;x.paidBy=paidIds.map((uid,i)=>({userId:uid,percent:Number(paidVals[i].toFixed(2)),amount:amounts[i]}));x.debtors=debtIds.map((uid,i)=>({userId:uid,percent:Number(debtVals[i].toFixed(2)),amount:debtAmounts[i],date:paidDate}));
 // Recalcula o histórico de dívidas gerado automaticamente por este lançamento para não duplicar ao editar/confirmar novamente.
 db.debts=(db.debts||[]).filter(d=>d.sourceMonthlyId!==x.id||!d.autoGenerated);
 debtIds.forEach((personId,i)=>{if(debtAmounts[i]>0)db.debts.unshift({id:uid('d'),personId,direction:'owed',amount:debtAmounts[i],date:paidDate,notes:`${x.name} — pessoa fica devendo`,sourceMonthlyId:x.id,autoGenerated:true});});
 window.paymentModalCommitted=true;addHistory(x.type==='receive'?'recebimento':'pagamento',x,{paidDate:x.paidDate,paidBy:x.paidBy,debtors:x.debtors});save();closeModal();
}

function purchaseValue(x){return num(x.purchaseAmount!=null&&x.purchaseAmount!==''?x.purchaseAmount:x.amount)}
function purchaseReturnRecord(x){return db.returns.find(r=>r.purchaseId===x.id)}
function returnListOf(r){if(!r)return 1;if(r.list)return Number(r.list);if(r.status==='Produtos devolvidos')return 3;if(/Aguardando devolução de valores|Aguardando reembolso/i.test(r.status||''))return 2;return 1}

 let r=purchaseReturnRecord(x);
 if(!r){r={id:uid('r'),purchaseId:x.id,name:x.name,amount:purchaseValue(x),list:1,returnDeadline:x.returnUntil||'',productReturnStatus:'Não',refundStatus:'Não',history:[]};db.returns.push(r)}
 r.amount=purchaseValue(x);r.name=x.name;r.returnDeadline=r.returnDeadline||x.returnUntil||'';r.list=returnListOf(r);return r

function syncAccountMonthly(a){
 if(!a?.id||!a.name)return;
 const startMonth=a.startMonth||a.referenceMonth||String(a.dueDate||today()).slice(0,7), start=new Date(startMonth+'-01T12:00:00'), step=repeatStep(a.repeat);if(!step)return;
 let count=1;
 if(a.repeat==='once')count=1;else if(a.period==='fixed')count=Math.max(0,a.fixedCount);else if(a.period==='determined'&&a.endMonth){const end=new Date(a.endMonth+'-01T12:00:00');count=Math.max(0,Math.floor(((end.getFullYear()-start.getFullYear())*12+(end.getMonth()-start.getMonth()))/step)+1)}else {const horizon=new Date();horizon.setMonth(horizon.getMonth()+24);count=Math.max(0,Math.floor(((horizon.getFullYear()-start.getFullYear())*12+(horizon.getMonth()-start.getMonth()))/step)+1)}
 const existingKeys=new Set(db.monthly.filter(m=>m.sourceAccountId===a.id).map(m=>m.referenceMonth+'|'+m.sourceOccurrence));
 const day=Number((a.dueDate||today()).slice(8,10))||1;
 for(let i=0;i<count;i++){const d=addMonthsSafe(start.toISOString().slice(0,10),i*step);const last=new Date(d.getFullYear(),d.getMonth()+1,0).getDate(),ds=iso(d).slice(0,8)+String(Math.min(day,last)).padStart(2,'0'),key=ds.slice(0,7)+'|'+(i+1);if(a.period==='determined'&&a.endMonth&&ds.slice(0,7)>a.endMonth)break;if(existingKeys.has(key))continue;db.monthly.push({id:uid('m'),name:a.name,type:a.direction==='in'?'receive':'pay',amount:num(a.value),payerId:a.direction==='out'?a.payerId:'',receiverId:a.direction==='in'?a.payerId:'',paymentId:a.paymentMethods?.[0]||'',accountId:a.id,dueDate:ds,referenceMonth:ds.slice(0,7),installments:1,recurrence:'account',sourceAccountId:a.id,sourceOccurrence:i+1,category:a.category||'',notes:'Gerado automaticamente pelo cadastro da conta',paidDate:ds.slice(0,7)<iso(new Date()).slice(0,7)?ds:'',paidBy:[]})}
}
function refreshAccountMonthly(a){db.monthly=db.monthly.filter(m=>!(m.sourceAccountId===a.id&&!m.paidDate));syncAccountMonthly(a)}
function syncAllAccounts(){let before=db.monthly.length;(db.accounts||[]).forEach(syncAccountMonthly);if(db.monthly.length!==before)localStorage.setItem(KEY,JSON.stringify(db));}

const AI_IMPORT_PROMPT=String.raw`Você é um extrator de dados financeiros.

- 💳 = indica cartão/meio de pagamento relacionado ao lançamento; não invente o banco.

- Checkbox desmarcado = pendente.

- Se aparecer apenas PG dia 12, transforme em data completa usando o mês/ano do print.
- Se mês ou ano não puder ser determinado com segurança, use data_pagamento=null e precisa_conferencia=true.

VALORES BRASILEIROS:
- 1.615,16 -> 1615.16
- 500,00 -> 500.00
- 89,99 -> 89.99

PORCENTAGENS E PESSOAS:
- Registre percentuais somente quando estiverem claramente escritos.
- Se uma pessoa transferiu/pagou uma parte, registre a pessoa e o percentual/valor somente quando isso estiver claramente indicado.

DESCRIÇÃO:
- Preserve a descrição original. Remova apenas marcadores que claramente são símbolos de status, como 🤡.

Se houver qualquer dúvida relevante, não adivinhe: use null e marque precisa_conferencia=true. Analise todos os lançamentos visíveis do mês.`;
function openAIModal(){openModal(`<div class="row between"><h2>🤖 Importar com IA</h2><button class="btn g sm" onclick="closeModal()">Fechar</button></div><div class="statusline">A função está disponível: cole o JSON produzido pela IA externa, confira a prévia e confirme a importação.</div><div class="row between" style="margin-top:12px"><strong>JSON gerado pela IA</strong><button class="btn g sm" onclick="openAIHowModal()">Como funciona?</button></div><textarea id="aiJsonInput" class="ai-json" style="margin-top:7px" placeholder="Cole aqui o JSON gerado pela IA..."></textarea><button class="btn p" style="width:100%;margin-top:8px" onclick="parseAIImport()">Conferir e importar JSON</button><div style="margin-top:16px;border-top:1px solid var(--bd);padding-top:12px"><div class="row between"><strong>Prompt da IA</strong><button class="btn p sm" onclick="copyAIPrompt()">Copiar prompt da IA</button></div><textarea id="aiPrompt" class="ai-prompt" style="margin-top:7px" readonly>${esc(AI_IMPORT_PROMPT)}</textarea></div>`)}
function normLoose(v){return norm(String(v||''))}
function matchExisting(value,list){const q=normLoose(value);if(!q)return null;let x=list.find(v=>normLoose(v.name)===q);if(x)return x;x=list.find(v=>normLoose(v.name).includes(q)||q.includes(normLoose(v.name)));return x||null}
function parseAIImport(){
 const raw=document.getElementById('aiJsonInput')?.value.trim();
 if(!raw)return alert('Cole o JSON gerado pela IA primeiro.');
 let data;try{data=JSON.parse(raw)}catch(e){return alert('JSON inválido: '+e.message)}
 if(data.formato!=='MeuAPPFinanceiro_Importacao_IA'||!Array.isArray(data.lancamentos))return alert('JSON não reconhecido. Use o prompt oficial do MeuAPPFinanceiro.');
 if(!data.lancamentos.length)return alert('O JSON não contém lançamentos.');
 const preview=data.lancamentos.map((l,i)=>{
  const person=matchExisting(l.pessoa,db.users), pay=matchExisting(l.meio_pagamento,db.payments), cat=matchExisting(l.categoria,db.categories);
  const amount=l.valor===null||l.valor===undefined||l.valor===''?null:num(l.valor);
  const paid=!!l.data_pagamento || l.status==='pago' || l.status==='recebido';
  return {source:l,index:i+1,person,pay,cat,amount,paid};
 });
 const list=preview.map((r,i)=>`<div class="item"><div><strong>${esc(r.source.descricao||'Sem descrição')}</strong><div class="muted">${r.source.tipo==='receive'?'📥 Entrada':'📤 Despesa'} · ${r.amount===null?'Valor não informado':money(r.amount)} · ${r.paid?(r.source.data_pagamento?'Pago/recebido em '+fmtDate(r.source.data_pagamento):'Marcado como pago/recebido'):'Pendente'}</div><div class="tiny">Pagamento: ${esc(r.pay?.name||r.source.meio_pagamento||'Não informado')} · Pessoa: ${esc(r.person?.name||r.source.pessoa||'Não informado')} · Categoria: ${esc(r.cat?.name||r.source.categoria||'Não informada')}</div>${r.source.precisa_conferencia?'<div class="small orange">⚠ Precisa conferência</div>':''}</div><button class="edit-toggle" onclick="editAIImportRow(${i})" title="Editar">✎</button></div>`).join('');
 window.aiImportRows=preview.map(r=>({source:r.source,personId:r.person?.id||'',paymentId:r.pay?.id||'',category:r.cat?.name||''}));
 openModal(`<div class="row between"><h2>🔎 Conferir importação</h2><button class="btn g sm" onclick="openAIModal()">Voltar</button></div><div class="statusline">${preview.length} lançamento(s) encontrados. O APP não cria cadastros automaticamente; associa apenas aos cadastros existentes.</div><div class="itemlist" style="margin-top:10px;max-height:48vh;overflow:auto">${list}</div><div class="modal-actions"><button class="btn g" onclick="openAIModal()">Cancelar</button><button class="btn p" onclick="confirmAIImport()">Importar ${preview.length}</button></div>`);
}

dex})">Salvar alteração</button></div>`);

function clearData(){if(confirm('Apagar todos os dados deste APP neste navegador?')){localStorage.removeItem(KEY);location.reload()}}
function exportPayload(){const safe=structuredClone(db);return JSON.stringify({...safe,exportVersion:VERSION,exportedAt:new Date().toISOString()},null,2)}
function exportJson(){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([exportPayload()],{type:'application/json'}));a.download=db.settings.jsonName||'MeuAPPFinanceiro_dados.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),500)}
function normalizeImportedData(x){return {...structuredClone(DEFAULT),...x,settings:{...structuredClone(DEFAULT.settings),...(x?.settings||{})}}}
function mergeRecords(base,incoming){const out=Array.isArray(base)?base.map(v=>structuredClone(v)):[];(Array.isArray(incoming)?incoming:[]).forEach(v=>{const i=out.findIndex(x=>x?.id&&v?.id&&x.id===v.id);if(i>=0)out[i]=structuredClone(v);else out.push(structuredClone(v))});return out}
function mergeDatabase(base,incoming){const b=normalizeImportedData(base||{}),n=normalizeImportedData(incoming||{});const out={...b};['users','payments','accounts','categories','monthly','purchases','returns','consumption','debts','futureDebts','history'].forEach(k=>out[k]=mergeRecords(b[k],n[k]));out.settings={...b.settings,...n.settings};out.version=VERSION;return out}
async function importJsonFile(f,mode='import'){if(!f)return;try{const x=JSON.parse(await f.text());const msg=mode==='connect'?'Os dados do aplicativo serão apagados e os dados do arquivo serão incorporados':'Os dados do aplicativo serão perdidos, e os dados do arquivo local serão incorporados';if(!confirm(msg)){document.getElementById('jsonInput').value='';window.jsonFileMode='';return}db=normalizeImportedData(x);localStorage.setItem(KEY,JSON.stringify(db));renderAll();alert(mode==='connect'?'Dados conectados com sucesso.':'Dados importados com sucesso.')}catch(err){alert('JSON inválido: '+err.message)}finally{document.getElementById('jsonInput').value='';window.jsonFileMode=''}}
function chooseJsonInput(mode){window.jsonFileMode=mode;document.getElementById('jsonInput').click()}
document.getElementById('jsonInput').onchange=e=>importJsonFile(e.target.files?.[0],window.jsonFileMode||'import');
async function connectJson(){if(!window.showOpenFilePicker)return chooseJsonInput('connect');try{const [h]=await showOpenFilePicker({multiple:false,types:[{description:'JSON',accept:{'application/json':['.json']}}]});const f=await h.getFile();if(!confirm('Os dados do aplicativo serão apagados e os dados do arquivo serão incorporados'))return;db=normalizeImportedData(JSON.parse(await f.text()));jsonHandle=h;localStorage.setItem(KEY,JSON.stringify(db));await writeJson();renderAll();}catch(e){if(e.name!=='AbortError')alert('Não foi possível conectar o JSON: '+e.message)}}
async function chooseJsonFolder(){if(!window.showDirectoryPicker)return alert('Seu navegador não oferece escolha persistente de pasta. Use Exportar/Importar JSON.');try{const h=await showDirectoryPicker({mode:'readwrite'});const name=db.settings.jsonName||'MeuAPPFinanceiro_dados.json';let existing=null;try{const fh=await h.getFileHandle(name);existing=JSON.parse(await (await fh.getFile()).text())}catch(e){if(e.name!=='NotFoundError')throw e}if(!confirm('Os dados do aplicativo serão salvos no local escolhido, se já houver um arquivo local, os dados do arquivo serão incorporados ao existente'))return;dirHandle=h;jsonHandle=await h.getFileHandle(name,{create:true});if(existing)db=mergeDatabase(db,existing);localStorage.setItem(KEY,JSON.stringify(db));await writeJson();renderAll();}catch(e){if(e.name!=='AbortError')alert('Não foi possível conectar a pasta: '+e.message)}}
async function writeJson(){if(!jsonHandle)return;try{if(jsonHandle.queryPermission){let p=await jsonHandle.queryPermission({mode:'readwrite'});if(p!=='granted')p=await jsonHandle.requestPermission({mode:'readwrite'});if(p!=='granted')throw new Error('Permissão negada')}const w=await jsonHandle.createWritable();await w.write(exportPayload());await w.close();document.getElementById('jsonStatus')?.replaceChildren(document.createTextNode('🟢 Conectado aos dados locais'));}catch(e){document.getElementById('jsonStatus')?.replaceChildren(document.createTextNode('🟠 Conectado aos dados locais, mas não foi possível gravar'))}}
function scheduleFileSave(){if(!jsonHandle)return;fileWriteQueue=fileWriteQueue.then(writeJson).catch(()=>{})}
async function refreshFromJson(){if(!jsonHandle){return showNotice('Não existe um arquivo local de onde o APP possa puxar as informações. Conecte um arquivo ou escolha uma pasta em Configurações.',{duration:6500});}try{db=normalizeImportedData(JSON.parse(await (await jsonHandle.getFile()).text()));localStorage.setItem(KEY,JSON.stringify(db));renderAll();showNotice('APP atualizado pelos dados locais.',{duration:4500});}catch(e){return actionError(e,'Não foi possível atualizar')}}
async function saveNow(){try{localStorage.setItem(KEY,JSON.stringify(db));if(!jsonHandle){renderAll();return showNotice('Não há arquivo local para salvar. Escolha uma pasta para criar o arquivo local e salvar os dados.',{duration:7000,action:()=>chooseJsonFolder(),actionLabel:'Escolher pasta'});}await writeJson();renderAll();showNotice('As informações do app foram salvas no arquivo local.',{duration:5000});return true}catch(e){return actionError(e,'Não foi possível salvar')}}

  {v:'1.10',date:TODAY,details:['Nova tela Pessoas Devem para controlar valores que outras pessoas devem ou que você deve, com saldos positivos e negativos.','Pagamento/recebimento ganhou modo Pessoa fica devendo, com divisão percentual e lançamento automático do valor devido.','Quem pagou/recebeu foi reorganizado para selecionar uma pessoa por vez e deixar o campo pronto para adicionar outra, recalculando a divisão.','Cadastro rápido de pessoa e meio de pagamento permanece disponível durante a confirmação.','Títulos das telas no celular voltam a ficar alinhados na mesma altura do botão de menu.','Campos de valor passam a usar R$ como indicação de preenchimento e desaparecem ao iniciar a digitação; valores existentes permanecem formatados.','Correções de persistência e edição de registros.']},

  {v:'1.7',date:TODAY,details:['Botões ＋ de todas as telas passaram a ser quadrados verdes, com bordas curvas e símbolo + centralizado, seguindo a identidade visual do botão Editar.','No Cadastro, os botões verdes “＋ Adicionar” ficam visíveis para Usuários, Pagamento, Contas e Categorias.','Na conferência do JSON importado pela IA, cada lançamento agora pode ser editado individualmente antes da importação.','Os filtros de Despesas Mensais, Itens de Consumo, Tabela de Gastos e Busca Histórico passaram a ficar dentro de um botão “Filtros”, com botão “Filtrar” para confirmar.','Os valores exibidos no APP usam o formato monetário brasileiro R$, com centavos sempre visíveis.','Busca Histórico passou a iniciar com todos os registros, separados por mês, diferenciando entradas recebidas e saídas pagas por símbolo e cor; os filtros são confirmados pelo botão Filtrar.','Importar com IA mantém a conferência antes da gravação e permite revisar os dados reconhecidos.']},
  {v:'1.6',date:'04/09/2026',details:['Importar com IA passou a funcionar como mecanismo de importação por JSON, com validação e prévia antes da gravação, mantendo a conferência antes de alterar os dados.','A tela de conferência permite revisar os lançamentos reconhecidos antes de confirmar a importação.','Em Sobre, o histórico de versões passou a ficar reunido em um único bloco retrátil com as versões 1.x.','Os símbolos do histórico passaram a indicar claramente expandir e recolher.','Botões de adicionar foram reforçados visualmente para ficarem aparentes nas telas.','Configurações receberam os nomes Conectar Dados, Exportar Dados, Importar Dados, Atualizar e Salvar, com as cores definidas para cada ação.']},
  {v:'1.5',date:'04/09/2026',details:['Importar com IA reservado para futura ativação, com campo para colar o JSON gerado por uma IA externa.','Tela “Como funciona?” orientando a copiar o prompt, enviá-lo para uma IA com os prints e processar um mês por vez.','Prompt completo da IA disponível no APP com botão “Copiar prompt da IA”.','Botões ＋ e Adicionar ajustados para ficarem visíveis e com identidade visual semelhante ao botão Editar.','A versão atual passa a ser a v1.5.']},
  {v:'1.4',date:'04/09/2026',details:['Melhoria visual dos botões de ação e do botão ＋, com botões de adicionar visíveis e com identidade semelhante ao botão de editar.','Títulos das páginas alinhados ao lado do botão de menu no celular.','Cadastro de Pagamento e Contas reorganizado com botão “Inserir Novo” e tela flutuante.','Cadastro de pagamentos ampliado com tipo, banco/instituição, número, vencimento e usuário responsável.','Cadastro de contas ampliado e com geração automática conforme repetição e período.','Pagamento de faturas com divisão por uma ou mais pessoas, por percentual, mantendo o total exato.','Menu fecha ao clicar fora.','Em Configurações, o status dos dados locais informa claramente “Não conectado aos dados locais” ou “Conectado aos dados locais”.','Botão “Conectar JSON” renomeado para “Conectar Dados”.','“Escolher pasta” passou a usar a mesma identidade visual de “Conectar Dados”.','Botões “Exportar Dados” e “Importar Dados” ficaram azuis, e “Atualizar” e “Salvar” ficaram cinza.']},

  {v:'1.2',date:'03/09/2026',details:['Contas recorrentes com períodos determinado, indeterminado ou fixo.','Débito Automático e múltiplos métodos disponíveis por conta.','Garantia e duração separadas nos Itens de Consumo.','Parcelamento de compras com lançamentos mensais vinculados à compra.','Datas de compra, entrega e devolução editáveis.','Long press no celular para devoluções.','Anexos vinculados ao JSON e à pasta local.','Migração e correções estruturais da versão anterior.']},

APP” foi atualizada para refletir as funções atuais do aplicativo.</li><li style="margin:5px 0">Aplicativo preparado para PWA com Manifesto, Service Worker e registro do Service Worker no HTML, para publicação em GitHub Pages.</li></ul></section></div></div><div class="version" id="versions2"><button onclick="toggleVersion('versions2')"><strong>Histórico de versões 2.x</strong><span>Encerrado na v2.12</span><span class="version-arrow">▼</span></button><div class="version-body"><strong>Histórico atual</strong><section style="padding:10px 0;border-bottom:1px solid var(--bd)"><div><strong>Versão 2.12</strong> <span class="muted">— 11/09/2026</span></div><ul style="padding-left:20px;margin-top:7px"><li style="margin:5px 0">Toque longo unificado para editar ou excluir itens, com cancelamento automático durante a rolagem e sem manter os mecanismos antigos de toque longo.</li><li style="margin:5px 0">Corrigida a exclusão por toque longo em Contas Futuras e removida a duplicação de função de listagem.</li><li style="margin:5px 0">Refinado o fluxo de cópia de compra para preservar os dados úteis de planejamento e iniciar uma nova compra sem dados transacionais antigos.</li><li style="margin:5px 0">Ajustadas as rotinas internas de movimentação, histórico, NF e garantia para reduzir inconsistências entre as listas.</li></ul></section><section style="padding:10px 0;border-bottom:1px solid var(--bd)"><div><strong>Versão 2.11</strong> <span class="muted">— 11/09/2026</span></div><ul style="padding-left:20px;margin-top:7px"><li style="margin:5px 0">Aprimorado o fluxo de edição, exclusão por toque longo e movimentação entre listas; a aba Devoluções passou a respeitar corretamente o modo de edição.</li><li style="margin:5px 0">Cancelamentos de marcação desmarcam automaticamente a caixa de seleção.</li><li style="margin:5px 0">Edição de Compras passou a permitir atualizar a NF vinculada e o histórico do produto foi reforçado.</li><li style="margin:5px 0">Segurar um item agora exige um toque mais longo e é cancelado quando o dedo começa a mover a tela.</li><li style="margin:5px 0">Contas Futuras recebeu modo de edição com lápis, filtro menor e remoção do rótulo Visualização.</li><li style="margin:5px 0">A tela Inicial deixou de considerar lançamentos gerados por Minhas Compras na lista de faturas e nos totais.</li><li style="margin:5px 0">Histórico dos produtos passou a incluir também os eventos registrados no fluxo de Devoluções.</li><li style="margin:5px 0">Movimentações e cópia de item foram refinadas para preservar melhor os dados já existentes.</li></ul></section><section style="padding:10px 0;border-bottom:1px solid var(--bd)"><div><strong>Versão 2.10</strong> <span class="muted">— 11/09/2026</span></div><ul style="padding-left:20px;margin-top:7px"><li style="margin:5px 0">Long press padronizado com duração de 1 segundo e cancelamento quando o dedo se move mais de 12 px.</li><li style="margin:5px 0">Contas Futuras recebeu modo de edição com lápis, filtro compacto e remoção do rótulo “Visualização”.</li><li style="margin:5px 0">A tela Inicial deixou de considerar lançamentos gerados por Minhas Compras na lista de faturas e nos totais.</li><li style="margin:5px 0">O histórico dos produtos passou a incluir também eventos registrados no fluxo de Devoluções.</li><li style="margin:5px 0">Busca Histórico e Contas Futuras passaram a oferecer edição/exclusão por toque longo.</li></ul></section><section style="padding:10px 0;border-bottom:1px solid var(--bd)"><div><strong>Versão 2.9</strong> <span class="muted">— 11/09/2026</span></div><ul style="padding-left:20px;margin-top:7px"><li style="margin:5px 0">Ajustado o histórico completo dos produtos em Compras e a exibição da NF vinculada à compra.</li><li style="margin:5px 0">Movimentação entre listas passou a preservar informações ao voltar para uma etapa anterior e solicitar os dados da etapa ao avançar.</li><li style="margin:5px 0">Garantia passou a usar meses de calendário e registrar a data final.</li><li style="margin:5px 0">Contas Futuras e Busca Histórico agora permitem, ao segurar um item, escolher entre editar ou excluir.</li></ul></section><section style="padding:10px 0;border-bottom:1px solid var(--bd)"><div><strong>Versão 2.8</strong> <span class="muted">— 10/09/2026</span></div><ul style="padding-left:20px;margin-top:7px"><li style="margin:5px 0">Despesas Mensais recebeu modo de edição com botão de lápis e exibição de parcelamento no valor.</li><li style="margin:5px 0">Minhas Compras recebeu correções no fluxo de devolução, edição, prazo de devolução, garantia, histórico e movimentação entre listas.</li><li style="margin:5px 0">Aba Devoluções recebeu edição própria e marcações laterais por situação, incluindo Produto Perdido/Extraviado.</li><li style="margin:5px 0">Garantia corrigida e bloqueada enquanto o produto estiver no fluxo de Devoluções.</li></ul></section><section style="padding:10px 0;border-bottom:1px solid var(--bd)"><div><strong>Versão 2.7</strong> <span class="muted">— 10/09/2026</span></div><ul style="padding-left:20px;margin-top:7px"><li style="margin:5px 0">Tabela de Gastos ajustou o balão do gráfico e a interação ao clicar fora dos pontos.</li><li style="margin:5px 0">Minhas Compras recebeu os novos fluxos de cadastro, marcação, devolução, movimentação e NF.</li><li style="margin:5px 0">A antiga aba Itens de Consumo passou a se chamar Compras, com histórico do item e garantia.</li></ul></section><section style="padding:10px 0;border-bottom:1px solid var(--bd)"><div><strong>Versão 2.6</strong> <span class="muted">— 10/09/2026</span></div><ul style="padding-left:20px;margin-top:7px"><li style="margin:5px 0">Tabela de Gastos passou a ter as abas Tabela de Faturas e Tabela de Compras, com visual de abas igual ao de Minhas Compras.</li><li style="margin:5px 0">Tabela de Compras recebeu os gráficos de compras e o mesmo filtro da Tabela de Faturas.</li><li style="margin:5px 0">O balão dos pontos do gráfico passou a ter a seta separada, a
